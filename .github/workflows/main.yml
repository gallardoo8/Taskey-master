name: Deploy Expo Update (OTA)

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar actualización Over-The-Air
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          eas update --branch preview --message "Actualización automática desde GitHub"
